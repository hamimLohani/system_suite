name: CI

on:
  push:
    branches: ["main", "master"]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            sudo apt-get update -y && sudo apt-get install -y shellcheck
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            brew install shellcheck
          fi

      - name: Run linting (ShellCheck)
        run: make lint

      - name: Run smoke tests
        env:
          TERM: dumb
        run: make test

      - name: Run bare-environment tests
        run: make test-ci

      - name: Verify release distribution packaging
        run: make dist
